site_name: Glowtape
site_description: Glowtape User Guide

theme:
  name: material

  logo: assets/glowtape-logo.svg
  favicon: assets/favicon.png

  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css